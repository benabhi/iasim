[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "iasim"
version = "0.1.0"
description = "Deterministic multi-agent survival simulation sandbox"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.9,<3",
]

[project.scripts]
iasim = "iasim.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/iasim"]

[dependency-groups]
dev = [
    "mypy>=1.13",
    "pytest>=8.3",
    "ruff>=0.8",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["B", "E", "F", "I", "RUF", "SIM", "UP"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src"]
plugins = ["pydantic.mypy"]
